{% extends 'base.html' %}

{% load static %}
{% load humanize %}

{%  block title %}Register | {% endblock %}

{% block content %}
<!-- <section id="register" class="bg-light py-5"> -->
  <section id="register" class="py-5" style="background-color: #d1b28c;">
    <div class="container">
      <div class="row">
        <div class="col-md-6 mx-auto">
          <div class="card">
            <div class="card-header bg-primary text-white">
              <h4>
                <i class="fas fa-user-plus"></i> Regisztráció</h4>
            </div>
            <div class="card-body">
                <!-- Alerts-->
                {% include 'partials/_alerts.html' %}
                <form action="{% url 'register' %}" method="POST">
                        {% csrf_token %}
                  <div class="form-group">
                  <label for="first_name">Vezetéknév</label>
                  <input type="text" name="first_name" class="form-control" required>
                </div>
                <div class="form-group">
                  <label for="last_name">Keresztnév</label>
                  <input type="text" name="last_name" class="form-control" required>
                </div>
                <div class="form-group">
                  <label for="username">Felhasználónév</label>
                  <input type="text" name="username" class="form-control" required>
                </div>
                <div class="form-group">
                  <label for="email">Email</label>
                  <input type="email" name="email" class="form-control" required>
                </div>
                <div class="form-group">
                  <label for="password2">Jelszó</label>
                  <input type="password" name="password" class="form-control" required>
                </div>
                <div class="form-group">
                  <label for="password">Jelszó ismét</label>
                  <input type="password" name="password2" class="form-control" required>
                </div>
                <input type="submit" value="Regisztrálok" class="btn btn-secondary btn-block">
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
{% endblock %}
